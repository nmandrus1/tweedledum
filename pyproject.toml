[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "tweedledum"
version = "1.2.0"
description = "A library for synthesizing and manipulating quantum circuits"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bruno Schmitt", email = "bruno.schmitt@epfl.ch" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "qiskit>=1.0",
    "python-sat>=1.8.dev0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
dev = [
    "tweedledum[test]",
    "pytest-cov",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/tweedledum"]
# Only ship the Python package + compiled module, not the C++ sources.
sdist.exclude = ["build", ".cache", "**/__pycache__", "**/.ipynb_checkpoints"]

[tool.scikit-build.cmake.define]
TWEEDLEDUM_PYBINDS = "ON"
TWEEDLEDUM_TESTS = "OFF"
TWEEDLEDUM_EXAMPLES = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/test"]
python_files = ["test_*.py"]
addopts = ["-ra"]

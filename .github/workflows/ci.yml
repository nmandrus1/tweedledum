name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ • ${{ matrix.os }} • ${{ matrix.compiler }} • C++${{ matrix.std }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc,   cxx: g++-13,     std: 17 }
          - { os: ubuntu-24.04, compiler: gcc,   cxx: g++-14,     std: 20 }
          - { os: ubuntu-24.04, compiler: clang, cxx: clang++-18, std: 17 }
          - { os: macos-latest, compiler: clang, cxx: clang++,    std: 17 }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build/cpp
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DTWEEDLEDUM_TESTS=ON
      - name: Build
        run: cmake --build build/cpp -j 4
      - name: Test
        run: ctest --test-dir build/cpp --output-on-failure

  python:
    name: Python ${{ matrix.python }} • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install ".[test]"
      - name: Test
        run: python -m pytest
